spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-1-us-west-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:postgres.hjigxbjeeecuehlbxxny}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# O banco Supabase legado possui as migrations V5 e V6, cujos arquivos nao fazem parte deste repositorio.
spring.flyway.ignore-migration-patterns=*:missing,*:future

api.security.token.secret=${JWT_SECRET}
api.security.cookie.secure=${COOKIE_SECURE:true}
api.security.cookie.same-site=${COOKIE_SAME_SITE:None}

supabase.url=${SUPABASE_URL:https://hjigxbjeeecuehlbxxny.supabase.co}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET:cardapio-imagens}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
