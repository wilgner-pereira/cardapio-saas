spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# O banco Supabase legado possui as migrations V5 e V6, cujos arquivos nao fazem parte deste repositorio.
spring.flyway.ignore-migration-patterns=*:missing,*:future

api.security.token.secret=${JWT_SECRET}
api.security.cookie.secure=${COOKIE_SECURE:true}
api.security.cookie.same-site=${COOKIE_SAME_SITE:None}

supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET:cardapio-imagens}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.setup-admin.enabled=${APP_SETUP_ADMIN_ENABLED:false}

spring.jpa.show-sql=false
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.reactor.netty.http.client=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
