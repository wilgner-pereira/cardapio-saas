spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

api.security.cookie.secure=true
api.security.cookie.same-site=${COOKIE_SAME_SITE:Strict}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.setup-admin.enabled=${APP_SETUP_ADMIN_ENABLED:false}

# Do not enable payload/header/SQL diagnostics on real traffic.
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.reactor.netty.http.client=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
