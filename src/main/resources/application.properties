spring.application.name=cardapio
spring.profiles.active=${SPRING_PROFILES_ACTIVE:supabase}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=never
management.endpoint.health.show-details=never
management.endpoint.health.group.admin.include=db,ping
management.endpoint.health.group.admin.show-components=always
management.endpoint.health.group.admin.show-details=never

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:1MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:2MB}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

api.security.token.issuer=${JWT_ISSUER:cardapio-online}
api.security.token.secret=${JWT_SECRET}
api.security.token.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
api.security.token.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
api.security.cookie.secure=${COOKIE_SECURE:true}
api.security.cookie.same-site=${COOKIE_SAME_SITE:None}
api.security.cookie.domain=${COOKIE_DOMAIN:}

supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET}

app.setup-admin.enabled=${APP_SETUP_ADMIN_ENABLED:false}
app.setup-admin.token=${APP_SETUP_ADMIN_TOKEN:}
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# Requests per minute, per source IP and application instance.
app.rate-limit.login=${RATE_LIMIT_LOGIN:5}
app.rate-limit.refresh=${RATE_LIMIT_REFRESH:30}
app.rate-limit.setup=${RATE_LIMIT_SETUP:5}
app.rate-limit.public=${RATE_LIMIT_PUBLIC:300}
app.rate-limit.max-keys=${RATE_LIMIT_MAX_KEYS:10000}

# 100 MiB per tenant; includes reservations, unlinked files and uncertain writes.
app.storage.tenant-quota-bytes=${STORAGE_TENANT_QUOTA_BYTES:104857600}
app.storage.cleanup-interval-ms=${STORAGE_CLEANUP_INTERVAL_MS:60000}
# Logs go to stdout; hosting must enforce the documented 30-day retention.
server.tomcat.accesslog.enabled=false
spring.mvc.log-request-details=false
